interface:
  display_name: "Job Application"
  short_description: "Run truthful autonomous job applications"
  default_prompt: "Use $job-application for authorized job-application work. If the user provides a specific job or application URL, enter DIRECT_LINK_HANDOFF mode: continue only from that URL and same-opening redirects or apply controls; never fall back to job search, discovery, alternate listings, or another job. If the user already uploaded a resume before handing over an ATS form such as Workday, keep that same resume attached, preserve current progress, and backfill or correct the remaining fields with confirmed workspace facts; re-upload only if the attachment is visibly absent, rejected/lost, or the user requests replacement. If the workflow fails or is blocked, report that the application was not completed and stop. For ordinary form filling, use the local Playwright executor with truthful prepared payloads. A CAPTCHA, MFA prompt, authentication challenge, anti-bot control, assessment, or other human-verification requirement must stop automation for that application and be handed to the user; never solve, evade, weaken, or bypass it. For an outreach request that already authorizes both preparation and sending, save every exact personalized note locally, then send the batch one profile at a time without asking for per-message or whole-batch review; show all notes only when the user asks, and verify each live field exactly before sending."
